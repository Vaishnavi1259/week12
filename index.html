
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bloom Studio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fdf6f8;
            text-align: center;
            padding: 100px 20px;
        }

        .card {
            background: white;
            padding: 35px;
            max-width: 350px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 4px 15px #eadde3;
        }

        h1 {
            color: #c56b8a;
        }

        p {
            color: #666;
        }

        button {
            background: #c56b8a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌷 Bloom Studio</h1>
        <p>A little space for creativity and inspiration.</p>
        <button onclick="alert('Have a lovely day! 💗')">
            Explore More
        </button>
    </div>

</body>
</html>
